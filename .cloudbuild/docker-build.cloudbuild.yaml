# Cloud Build configuration for clinvar-submitter
#
# Command line test usage:
# gcloud builds submit --project=clingen-dx --config ./cloudbuild.yaml --substitutions=COMMIT_SHA="testbuild",SHORT_SHA="testbuild" .

# Builds clinvar-submitter for multiple architectures (AMD64 and ARM64)
# and pushes to prod Artifact Registry
steps:
# Set up Docker Buildx for multi-architecture builds
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'buildx'
    - 'create'
    - '--name'
    - 'multiarch-builder'
    - '--driver'
    - 'docker-container'
    - '--use'
    - '--bootstrap'
# Build and push multi-architecture image using buildx
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'buildx'
    - 'build'
    - '--platform'
    - 'linux/amd64,linux/arm64'
    - '-t'
    - 'gcr.io/clingen-dx/clinvar-submitter:$COMMIT_SHA'
    - '--push'
    - '.'
- name: 'gcr.io/clingen-dx/git-image-updater'
  secretEnv: ["GITHUB_TOKEN"]
  args:
    - '-c'
    - |
      git clone https://clingen-ci:$$GITHUB_TOKEN@github.com/clingen-data-model/architecture \
      && cd architecture \
      && git checkout -b image-update-$SHORT_SHA \
      && /usr/bin/yq eval -i '.image.tag = "$COMMIT_SHA"' ./helm/values/clinvar-submitter/values-prod.yaml \
      && git add -u \
      && git -c user.name="Clingen CI Automation" -c user.email="clingendevs@broadinstitute.org" commit -m "bumping docker image for clinvar-submitter" \
      && git push origin image-update-$SHORT_SHA \
      && gh pr create --fill -l automation

availableSecrets:
  secretManager:
    - versionName: projects/clingen-dx/secrets/clingen-ci-github-token/versions/1
      env: GITHUB_TOKEN

# Note: The 'images' section is not needed because buildx --push handles the push
# Multi-arch images are pushed directly during the build step

# timeout if not complete in 90 minutes
timeout: 5400s
